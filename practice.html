<section>
<h2>Day 1: Tables, keys and grain</h2>
<ol>
<li><p>The returns desk's return_items has 8 rows. COUNT(DISTINCT return_id) is 5 and COUNT(DISTINCT product_ref) is 5. The distinct pairs (return_id, item_no) number 8. What names one row?</p><ul><li><b>A.</b> return_id alone</li><li><b>B.</b> The pair return_id and item_no</li><li><b>C.</b> product_ref alone</li><li><b>D.</b> No column: the table has no key</li></ul></li>
<li><p>The returns desk inspects some returns once, some twice, and some never. inspections holds return_id, inspected_on and result. Which sentence states its grain?</p><ul><li><b>A.</b> One row per return</li><li><b>B.</b> One row per inspection result</li><li><b>C.</b> One row per return, inspected or not</li><li><b>D.</b> One row per inspection of one return</li></ul></li>
<li><p>The returns desk's wide table copies the reason label onto every item. A colleague renamed R2 in some rows only, so both labels now appear. What is the right fix?</p><ul><li><b>A.</b> Correct the label once in reasons and rebuild the wide table</li><li><b>B.</b> Update the remaining rows of the wide table</li><li><b>C.</b> Add DISTINCT to every report on the wide table</li><li><b>D.</b> Delete the reasons table and keep the wide one</li></ul></li>
<li><p>The returns desk stores inspected_at as a TIMESTAMP. You need every inspection of May 2026, including those late on 31 May.</p><ul><li><b>A.</b> inspected_at BETWEEN '2026-05-01' AND '2026-05-31'</li><li><b>B.</b> inspected_at LIKE '2026-05%'</li><li><b>C.</b> inspected_at &gt;= '2026-05-01' AND inspected_at &lt; '2026-06-01'</li><li><b>D.</b> inspected_at &gt;= '2026-05-01' AND inspected_at &lt;= '2026-06-01'</li></ul></li>
<li><p>A training team keeps a table of course bookings: 640 rows, 410 distinct employee codes, 52 distinct course codes and 640 distinct pairs of employee and course session. Which of these is a key of the table?</p><ul><li><b>A.</b> The pair of employee and course session</li><li><b>B.</b> There is no key, since no single column is unique</li><li><b>C.</b> The employee code</li><li><b>D.</b> The course code</li></ul></li>
<li><p>A fleet team's table has one row each time a vehicle is refuelled, with the vehicle code, the date and the litres. Which sentence states its grain?</p><ul><li><b>A.</b> One row per day</li><li><b>B.</b> One row per litre of fuel</li><li><b>C.</b> One row per vehicle</li><li><b>D.</b> One row per refuelling of one vehicle</li></ul></li>
<li><p>A facilities team counts work orders per building by grouping the work-order table by building and taking the smallest count. It reads 1. Fourteen buildings have no work order at all. What does the query report as the fewest work orders per building?</p><ul><li><b>A.</b> NULL, because some buildings have no rows</li><li><b>B.</b> 0, because the fourteen buildings are counted</li><li><b>C.</b> 1, because buildings without work orders are not in the grouped table</li><li><b>D.</b> 14, the number of buildings that have no work order in the table at all</li></ul></li>
<li><p>In an analytical wide table that repeats each branch's city on every sales row, the right way to correct a branch's city is to update the wide table's rows for that branch.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
<li><p>A help desk stores ticket creation as a TIMESTAMP. A report must count every ticket created in April 2026. Which condition is right?</p><ul><li><b>A.</b> created_at BETWEEN '2026-04-01' AND '2026-04-30'</li><li><b>B.</b> created_at &gt;= '2026-04-01' AND created_at &lt; '2026-05-01'</li><li><b>C.</b> created_at &gt; '2026-04-01' AND created_at &lt; '2026-04-30'</li><li><b>D.</b> MONTH(created_at) = 4, which reads the month of every timestamp directly</li></ul></li>
</ol>
</section>
<section>
<h2>Day 2: One table, then two</h2>
<ol>
<li><p>returns has 5 rows and 4 distinct order_ref values; inspections can hold two rows for one return.</p><ul><li><b>A.</b> order_ref is a key of returns</li><li><b>B.</b> The grain of inspections is one row per return</li><li><b>C.</b> Joining returns to inspections can repeat a return</li><li><b>D.</b> A join to inspections keeps exactly 5 rows</li></ul></li>
<li><p>The returns desk wants the distinct product codes returned in May 2026 that were not returned in June 2026.</p><ul><li><b>A.</b> May's product codes EXCEPT June's product codes</li><li><b>B.</b> May's item rows EXCEPT June's item rows</li><li><b>C.</b> May's product codes UNION June's product codes</li><li><b>D.</b> May's product codes INTERSECT June's product codes</li></ul></li>
<li><p>An inspections table has 6 rows. result is 'pass' in 3, 'fail' in 1 and NULL in 2. What does SELECT COUNT(*) FROM inspections WHERE result &lt;&gt; 'pass' return?</p><ul><li><b>A.</b> 3</li><li><b>B.</b> 6</li><li><b>C.</b> 0</li><li><b>D.</b> 1</li></ul></li>
<li><p>A table of 40 deliveries covers 6 couriers; courier K9 made only 1 delivery. SELECT courier_id, COUNT(*) FROM deliveries GROUP BY courier_id HAVING COUNT(*) &gt; 1. How many rows come back?</p><ul><li><b>A.</b> 39</li><li><b>B.</b> 5</li><li><b>C.</b> 6</li><li><b>D.</b> 0</li></ul></li>
<li><p>couriers has 4 rows. shifts has 7 rows: courier A has 3 shifts, B has 2, C has 2, D has none. How many rows does couriers LEFT JOIN shifts return?</p><ul><li><b>A.</b> 4</li><li><b>B.</b> 7</li><li><b>C.</b> 8</li><li><b>D.</b> 28</li></ul></li>
<li><p>A payroll query bands overtime hours: CASE WHEN hours &lt;= 10 THEN 'low' WHEN hours &lt;= 2 THEN 'minimal' ELSE 'high' END. A worker with 1 hour of overtime gets which band?</p><ul><li><b>A.</b> low</li><li><b>B.</b> high</li><li><b>C.</b> NULL</li><li><b>D.</b> minimal</li></ul></li>
<li><p>A staff table has 10 rows: 6 in department HR, 2 in IT and 2 with no department recorded. How many rows does WHERE department &lt;&gt; 'HR' keep?</p><ul><li><b>A.</b> 0</li><li><b>B.</b> 10</li><li><b>C.</b> 4</li><li><b>D.</b> 2</li></ul></li>
<li><p>In any table, COUNT(*) and COUNT(phone) return the same number.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
<li><p>A clinic wants the doctors who saw more than 200 patients last month. Where does the condition COUNT(*) &gt; 200 belong?</p><ul><li><b>A.</b> In the SELECT list</li><li><b>B.</b> In WHERE, before GROUP BY, so fewer rows are grouped</li><li><b>C.</b> In HAVING, after GROUP BY doctor</li><li><b>D.</b> In ORDER BY</li></ul></li>
<li><p>A table of 300 library loans covers 4 branches. SELECT branch, COUNT(*) FROM loans WHERE returned = false GROUP BY branch returns rows for how many branches at most?</p><ul><li><b>A.</b> 300</li><li><b>B.</b> 4</li><li><b>C.</b> 1</li><li><b>D.</b> It cannot be known without running it</li></ul></li>
<li><p>teams has 3 rows; members has 5 rows: team A has 3 members, team B has 2, team C none. How many rows does teams INNER JOIN members return?</p><ul><li><b>A.</b> 5</li><li><b>B.</b> 15</li><li><b>C.</b> 3</li><li><b>D.</b> 6</li></ul></li>
<li><p>A school wants the courses that no student has enrolled in. Which pattern answers it?</p><ul><li><b>A.</b> courses WHERE EXISTS (an enrolment for that course)</li><li><b>B.</b> enrolments GROUP BY course HAVING COUNT(*) = 0, which counts the empty courses</li><li><b>C.</b> courses INNER JOIN enrolments</li><li><b>D.</b> courses WHERE NOT EXISTS (an enrolment for that course)</li></ul></li>
</ol>
</section>
<section>
<h2>Day 3: Combining safely, then windows</h2>
<ol>
<li><p>A branches table has 5 rows; 2 branches have no region. SELECT COUNT(*) FROM branches WHERE region NOT IN ('North', NULL).</p><ul><li><b>A.</b> 3</li><li><b>B.</b> 0</li><li><b>C.</b> 5</li><li><b>D.</b> 2</li></ul></li>
<li><p>A clinic sums appointment fees after joining appointments (one row per appointment) to reminders (one row per reminder sent). Some appointments got three reminders. The total is 40% above the ledger.</p><ul><li><b>A.</b> Fees left NULL are counted as zero</li><li><b>B.</b> The join drops appointments with no reminder</li><li><b>C.</b> Fees are rounded to two decimals</li><li><b>D.</b> Each fee is repeated once per reminder</li></ul></li>
<li><p>A hotel's chain: stays (one row per stay) joined to charges (one row per charge), then SUM(nightly_rate * nights) per month. The result is far above the ledger.</p><ul><li><b>A.</b> The final GROUP BY month</li><li><b>B.</b> The join of stays to charges before summing stay values</li><li><b>C.</b> Using WITH instead of a subquery</li><li><b>D.</b> Multiplying rate by nights</li></ul></li>
<li><p>Sales per product in each region: in the West, two products tie for third place. The manager wants both shown, and the next product, if any, to be fifth.</p><ul><li><b>A.</b> ROW_NUMBER() and place &lt;= 3</li><li><b>B.</b> DENSE_RANK() and place &lt;= 3</li><li><b>C.</b> RANK() and place &lt;= 3</li><li><b>D.</b> ORDER BY sales DESC LIMIT 3</li></ul></li>
<li><p>A pharmacy's daily sales table has no rows for two closed days. For each day, the report wants the average daily sales of the days that had sales within the last seven calendar days, that day included.</p><ul><li><b>A.</b> AVG OVER (ORDER BY day RANGE BETWEEN INTERVAL 6 DAYS PRECEDING AND CURRENT ROW)</li><li><b>B.</b> AVG OVER (ORDER BY day ROWS BETWEEN 6 PRECEDING AND CURRENT ROW)</li><li><b>C.</b> AVG OVER (PARTITION BY day)</li><li><b>D.</b> AVG with GROUP BY week</li></ul></li>
<li><p>A gym sums membership fees after joining members (one row per member) to visits (one row per visit). The total is several times the fee ledger. What happened?</p><ul><li><b>A.</b> The join changed the fee values</li><li><b>B.</b> Members without visits were counted twice</li><li><b>C.</b> Each member's fee was repeated once per visit</li><li><b>D.</b> NULL fees were counted as zero</li></ul></li>
<li><p>You need total fees of members who visited at least once, each fee counted once. Which query shape is right?</p><ul><li><b>A.</b> Join members to visits and SUM(DISTINCT fee)</li><li><b>B.</b> SUM(fee) over members WHERE EXISTS a visit for that member</li><li><b>C.</b> SUM(fee) over members LEFT JOIN visits, so members without visits stay in</li><li><b>D.</b> Join members to visits and SUM(fee)</li></ul></li>
<li><p>A chain of three common table expressions returns a total that looks too high. What is the best first move?</p><ul><li><b>A.</b> Run each step alone and check its row count and grain</li><li><b>B.</b> Round every amount to whole riyals</li><li><b>C.</b> Add DISTINCT to the final SELECT</li><li><b>D.</b> Rewrite it as one query without WITH</li></ul></li>
<li><p>If a query runs without an error on the schema, it follows the business rules of the organisation.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
<li><p>A table has 120 rows for 4 warehouses. How many rows does SELECT warehouse, SUM(stock) OVER (PARTITION BY warehouse) FROM stock return?</p><ul><li><b>A.</b> 1</li><li><b>B.</b> 480</li><li><b>C.</b> 4</li><li><b>D.</b> 120</li></ul></li>
<li><p>Scores 90, 85, 85 and 80 are ranked from the highest with DENSE_RANK(). Which places do they get?</p><ul><li><b>A.</b> 1, 2, 3, 4</li><li><b>B.</b> 1, 2, 2, 4</li><li><b>C.</b> 1, 2, 2, 3</li><li><b>D.</b> 1, 1, 2, 3</li></ul></li>
<li><p>A daily table of a clinic has no rows for the days it was closed. Which frame averages the last seven calendar days for each day?</p><ul><li><b>A.</b> ROWS BETWEEN 6 PRECEDING AND CURRENT ROW</li><li><b>B.</b> RANGE BETWEEN INTERVAL 6 DAYS PRECEDING AND CURRENT ROW</li><li><b>C.</b> ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW</li><li><b>D.</b> PARTITION BY week</li></ul></li>
<li><p>LAG(amount) OVER (PARTITION BY customer ORDER BY day) returns NULL on the first row of every customer.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
</ol>
</section>
<section>
<h2>Day 4: Building and checking</h2>
<ol>
<li><p>A bakery ranks products by units sold. Two products tie for second place. The next product should be third.</p><ul><li><b>A.</b> ROW_NUMBER()</li><li><b>B.</b> DENSE_RANK()</li><li><b>C.</b> RANK()</li><li><b>D.</b> NTILE(3)</li></ul></li>
<li><p>A clinic's appointments file: read 500, loaded 480, rejected 15 (12 unknown patient, 3 invalid date).</p><ul><li><b>A.</b> The load is complete and every row is accounted for</li><li><b>B.</b> The transaction rolled back 15 rows</li><li><b>C.</b> Five rows are unaccounted for</li><li><b>D.</b> The file was loaded twice</li></ul></li>
<li><p>A gym's members table: member_id, full_name, phone, birth_date, branch, joined_on. The analysts count members per branch and per age band.</p><ul><li><b>A.</b> member_id, branch, age band</li><li><b>B.</b> member_id, branch, birth_date</li><li><b>C.</b> member_id, branch, birth_date, joined_on</li><li><b>D.</b> a copy of the table without full_name</li></ul></li>
<li><p>A clinic's appointments table, 2 million rows, an index on patient_id.</p><ul><li><b>A.</b> appointments per month this year</li><li><b>B.</b> appointments of doctor D12</li><li><b>C.</b> patients whose number ends in 42</li><li><b>D.</b> appointments of patient P-1093</li></ul></li>
<li><p>A pharmacy fixture has six orders, none with two delivery attempts. The generated revenue query matches the hand-checked answer.</p><ul><li><b>A.</b> The query is correct on the full data</li><li><b>B.</b> It follows the rule on the cases the fixture holds; repeat attempts are untested</li><li><b>C.</b> Nothing: generated queries cannot be trusted</li><li><b>D.</b> The fixture is too small to mean anything</li></ul></li>
<li><p>A library's loans table must refuse a loan whose member code is not in the members table. Which constraint does that?</p><ul><li><b>A.</b> A foreign key REFERENCES members (member_code)</li><li><b>B.</b> A CHECK on the member code that compares it with the members table</li><li><b>C.</b> A PRIMARY KEY on the member code</li><li><b>D.</b> NOT NULL on the member code</li></ul></li>
<li><p>Why does a load of a raw supplier file go first into a staging table with every column as text?</p><ul><li><b>A.</b> Because text columns make the final table smaller</li><li><b>B.</b> Because constraints cannot be written on text columns</li><li><b>C.</b> So that the bad rows are fixed automatically</li><li><b>D.</b> So that every row is read and each bad row gets a reason</li></ul></li>
<li><p>A team loads 300 invoices and then their 1,100 invoice lines inside one transaction. The lines insert fails on a constraint and the transaction is rolled back. How many invoices remain loaded?</p><ul><li><b>A.</b> It depends on the order of the rows in the file</li><li><b>B.</b> 300</li><li><b>C.</b> 0</li><li><b>D.</b> 300 minus the invoices of the failing lines</li></ul></li>
<li><p>A load log that reads "read 1,000, loaded 960, rejected 40" accounts for every row of the file.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
<li><p>A sports club's members table has member_number, full_name, mobile, postcode, birth_date and newsletter (yes or no). Which column is an indirect identifier?</p><ul><li><b>A.</b> mobile</li><li><b>B.</b> postcode</li><li><b>C.</b> newsletter</li><li><b>D.</b> full_name</li></ul></li>
<li><p>Analysts of a utility company count meters per district and per installation year. The meters table has meter_id, customer_name, customer_phone, district, installed_on and address. What should their view expose?</p><ul><li><b>A.</b> meter_id, district and the installation year</li><li><b>B.</b> meter_id, district, installed_on and address</li><li><b>C.</b> A copy of the table with the names replaced by initials</li><li><b>D.</b> Every column except customer_name</li></ul></li>
<li><p>An analyst wants help from a public generative AI assistant with a query over a Restricted customer table. What may be pasted into it?</p><ul><li><b>A.</b> Twenty sample rows, to show the shape of the data</li><li><b>B.</b> A screenshot of the result with the names blurred</li><li><b>C.</b> The output of the analyst view, since it has no names, phones or e-mail addresses</li><li><b>D.</b> The column names, the business rule as text and the error message</li></ul></li>
<li><p>An index on the store column turns a query that sums every sale of the year by store into a search.</p><ul><li><b>A.</b> True</li><li><b>B.</b> False</li></ul></li>
<li><p>In the plan of a query that joins two tables, filters one of them and groups the result, which operators appear at the bottom of the tree?</p><ul><li><b>A.</b> The projection of the returned columns</li><li><b>B.</b> The join</li><li><b>C.</b> The scans that read the two tables</li><li><b>D.</b> The group by</li></ul></li>
<li><p>A generated query sums the value of shipped parcels after joining parcels to tracking_events, one row per scan of a parcel. On a hand-checked fixture it returns 410.00 where the answer is 205.00. Which kind of failure is it most likely?</p><ul><li><b>A.</b> A missing business rule</li><li><b>B.</b> Fan-out from the join to the events</li><li><b>C.</b> Wrong grain in the average</li><li><b>D.</b> A rounding error</li></ul></li>
<li><p>Where should the expected answer of a test for a generated query come from?</p><ul><li><b>A.</b> By hand, on a fixture small enough to check</li><li><b>B.</b> From the total in last month's report</li><li><b>C.</b> From running the generated query on the full data</li><li><b>D.</b> From a second generated query</li></ul></li>
<li><p>The question is "average value per order". A generated query returns AVG(quantity * unit_price) over order lines. Orders have about four lines each. What is wrong?</p><ul><li><b>A.</b> Nothing: AVG gives the average of the values</li><li><b>B.</b> It misses the discount rule, so every line is a little too high</li><li><b>C.</b> It double counts lines through a join</li><li><b>D.</b> It averages per line, not per order: sum the lines of each order first</li></ul></li>
</ol>

ymptom: queries still return two labels for one code","Throws away the source of truth: the wide table cannot be rebuilt once reasons is gone"],"lo":["LO1"],"day":1,"session":3,"slide":{"deck":"day1","id":"check-wide","title":"The wide returns table shows two labels for R2. What do you do?"},"level":null,"pool":"checkpoint"},{"id":"check-dates-q1","type":"single","prompt":"The returns desk stores inspected_at as a TIMESTAMP. You need every inspection of May 2026, including those late on 31 May.","options":[{"key":"A","text":"inspected_at BETWEEN '2026-05-01' AND '2026-05-31'"},{"key":"B","text":"inspected_at LIKE '2026-05%'"},{"key":"C","text":"inspected_at >= '2026-05-01' AND inspected_at \u003c '2026-06-01'"},{"key":"D","text":"inspected_at >= '2026-05-01' AND inspected_at \u003c= '2026-06-01'"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The half-open range keeps all of 31 May and nothing of 1 June, whatever the time of day.","misconceptions":["Ends at the first instant of 31 May on a timestamp: the rest of the last day is lost","Compares text with a pattern: works only while the column is text, and stops working once it is a timestamp","","Includes the first instant of June, so an inspection logged at midnight on 1 June is counted in May"],"lo":["LO3"],"day":1,"session":4,"slide":{"deck":"day1","id":"check-dates","title":"Which filter counts every inspection made in May 2026?"},"level":null,"pool":"checkpoint"},{"id":"review-day1-q1","type":"single","prompt":"returns has 5 rows and 4 distinct order_ref values; inspections can hold two rows for one return.","options":[{"key":"A","text":"order_ref is a key of returns"},{"key":"B","text":"The grain of inspections is one row per return"},{"key":"C","text":"Joining returns to inspections can repeat a return"},{"key":"D","text":"A join to inspections keeps exactly 5 rows"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A return inspected twice matches two rows of inspections, so it appears twice after the join.","misconceptions":["Takes a column that looks like an identifier for a key: 4 distinct values for 5 rows","Reads the grain from the first column instead of from what one row records","","Believes a join never changes the number of rows of the left table"],"lo":["LO1"],"day":2,"session":null,"slide":{"deck":"day2","id":"review-day1","title":"Which statement about the returns desk's tables is right?"},"level":null,"pool":"checkpoint"},{"id":"check-case-q1","type":"single","prompt":"The returns desk wants the distinct product codes returned in May 2026 that were not returned in June 2026.","options":[{"key":"A","text":"May's product codes EXCEPT June's product codes"},{"key":"B","text":"May's item rows EXCEPT June's item rows"},{"key":"C","text":"May's product codes UNION June's product codes"},{"key":"D","text":"May's product codes INTERSECT June's product codes"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The question is about a set of products, so both sides select the product code, and EXCEPT removes June's.","misconceptions":["","Compares whole rows: two item rows of different returns never match, so nothing is removed","Combines the two sets instead of taking one from the other","Keeps only what the two months share, the opposite of the question"],"lo":["LO3"],"day":2,"session":1,"slide":{"deck":"day2","id":"check-case","title":"Which query lists products returned in May but not in June?"},"level":null,"pool":"checkpoint"},{"id":"check-null-q1","type":"single","prompt":"An inspections table has 6 rows. result is 'pass' in 3, 'fail' in 1 and NULL in 2. What does SELECT COUNT(*) FROM inspections WHERE result \u003c> 'pass' return?","options":[{"key":"A","text":"3"},{"key":"B","text":"6"},{"key":"C","text":"0"},{"key":"D","text":"1"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Only the 'fail' row makes the condition true. For the two NULL rows the condition is  courier matched every shift"],"lo":["LO2"],"day":2,"session":4,"slide":{"deck":"day2","id":"check-join","title":"How many rows does the left join return?"},"level":null,"pool":"checkpoint"},{"id":"review-day2-q1","type":"single","prompt":"A branches table has 5 rows; 2 branches have no region. SELECT COUNT(*) FROM branches WHERE region NOT IN ('North', NULL).","options":[{"key":"A","text":"3"},{"key":"B","text":"0"},{"key":"C","text":"5"},{"key":"D","text":"2"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"NOT IN with a NULL in the list is region \u003c> NULL for every row: unknown, so nothing is ever true.","misconceptions":["Treats NULL in the list as a value to exclude, as if NOT IN ignored it","","Counts the branches without a region as different from North","Believes the NULL rows are the only ones kept"],"lo":["LO2"],"day":3,"session":null,"slide":{"deck":"day3","id":"review-day2","title":"How many rows does this query return?"},"level":null,"pool":"checkpoint"},{"id":"check-fan-out-q1","type":"single","prompt":"A clinic sums appointment fees after joining appointments (one row per appointment) to reminders (one row per reminder sent). Some appointments got three reminders. The total is 40% above the ledger.","options":[{"key":"A","text":"Fees left NULL are counted as zero"},{"key":"B","text":"The join drops appointments with no reminder"},{"key":"C","text":"Fees are rounded to two decimals"},{"key":"D","text":"Each fee is repeated once per reminder"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"After the join the grain is the reminder: an appointment with three reminders carries its fee three times.","misconceptions":["Blames NULLs, which make sums smaller, not larger","An inner join drops appointments without reminders; that lowers the total","Rounding cannot add 40%",""],"lo":["LO6"],"day":3,"session":1,"slide":{"deck":"day3","id":"check-fan-out","title":"Why is the total fee too high?"},"level":null,"pool":"checkpoint"},{"id":"check-cte-q1","type":"single","prompt":"A hotel's chain: stays (one row per stay) joined to charges (one row per charge), then SUM(nightly_rate * nights) per month. The result is far above the ledger.","options":[{"key":"A","text":"The final GROUP BY month"},{"key":"B","text":"The join of stays to charges before summing stay values"},{"key":"C","text":"Using WITH instead of a subquery"},{"key":"D","text":"Multiplying rate by nights"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A stay with several charges appears once per charge, so its value is summed several times.","misconceptions":["Grouping by month is the grain the question asks for","","Naming steps cannot change a result; only their content can","Multiplying two columns of the same row is correct"],"lo":["LO3"],"day":3,"session":2,"slide":{"deck":"day3","id":"check-cte","title":"Where is the error in this chain?"},"level":null,"pool":"checkpoint"},{"id":"check-rank-q1","type":"single","prompt":"Sales per product in each region: in the West, two products tie for third place. The manager wants both shown, and the next product, if any, to be fifth.","options":[{"key":"A","text":"ROW_NUMBER() and place \u003c= 3"},{"key":"B","text":"DENSE_RANK() and place \u003c= 3"},{"key":"C","text":"RANK() and place \u003c= 3"},{"key":"D","text":"ORDER BY sales DESC LIMIT 3"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"RANK gives ties the same place and skips the next one, as asked.","misconceptions":["Gives tied rows different numbers, so one of the tied products is cut","Keeps both ties but numbers the next product 4, not 5","","LIMIT applies to the whole result, not to each region"],"lo":["LO4"],"day":3,"session":3,"slide":{"deck":"day3","id":"check-rank","title":"Which ranking keeps every tied product in a \"top three\"?"},"level":null,"pool":"checkpoint"},{"id":"check-frame-q1","type":"single","prompt":"A pharmacy's daily sales table has no rows for two closed days. For each day, the report wants the average daily sales of the days that had sales within the last seven calendar days, that day included.","options":[{"key":"A","text":"AVG OVER (ORDER BY day RANGE BETWEEN INTERVAL 6 DAYS PRECEDING AND CURRENT ROW)"},{"key":"B","text":"AVG OVER (ORDER BY day ROWS BETWEEN 6 PRECEDING AND CURRENT ROW)"},{"key":"C","text":"AVG OVER (PARTITION BY day)"},{"key":"D","text":"AVG with GROUP BY week"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"RANGE with an interval selects rows by date, so the window always covers seven calendar days.","misconceptions":["","Counts seven rows, which reach back nine calendar days after the closure","Without ORDER BY the window is the whole table: one average for every row","A GROUP BY returns one row per week, not a moving value for each day"],"lo":["LO4"],"day":3,"session":4,"slide":{"deck":"day3","id":"check-frame","title":"Which seven-day average is right after a closed weekend?"},"level":null,"pool":"checkpoint"},{"id":"review-day3-q1","type":"single","prompt":"A bakery ranks products by units sold. Two products tie for second place. The next product should be third.","options":[{"key":"A","text":"ROW_NUMBER()"},{"key":"B","text":"DENSE_RANK()"},{"key":"C","text":"RANK()"},{"key":"D","text":"NTILE(3)"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"DENSE_RANK gives ties one rank and continues with the next number: 1, 2, 2, 3.","misconceptions":["ROW_NUMBER gives every row its own number: one of the tied products becomes third","","RANK gives the tie the same number but skips the next: the product after them is fourth","NTILE splits rows into equal buckets; it does not rank by ties"],"lo":["LO3"],"day":4,"session":null,"slide":{"deck":"day4","id":"review-day3","title":"Which ranking gives the tied products the same rank, and leaves no gap after them?"},"level":null,"pool":"checkpoint"},{"id":"check-load-log-q1","type":"single","prompt":"A clinic's appointments file: read 500, loaded 480, rejected 15 (12 unknown patient, 3 invalid date).","options":[{"key":"A","text":"The load is complete and every row is accounted for"},{"key":"B","text":"The transaction rolled back 15 rows"},{"key":"C","text":"Five rows are unaccounted for"},{"key":"D","text":"The file was loaded twice"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"480 + 15 = 495, not 500. Five rows were neither loaded nor rejected: the log is not finished until read equals loaded plus rejected.","misconceptions":["Assumes the totals are fine because every rejection has a reason","The transaction concerns rows that were inserted; the log counts rows that were not","","Unknown patients are a reason to reject, not a sign of a duplicate file"],"lo":["LO5"],"day":4,"session":1,"slide":{"deck":"day4","id":"check-load-log","title":"What does this load log tell you?"},"level":null,"pool":"checkpoint"},{"id":"check-view-q1","type":"single","prompt":"A gym's members table: member_id, full_name, phone, birth_date, branch, joined_on. The analysts count members per branch and per age band.","options":[{"key":"A","text":"member_id, branch, age band"},{"key":"B","text":"member_id, branch, birth_date"},{"key":"C","text":"member_id, branch, birth_date, joined_on"},{"key":"D","text":"a copy of the table without full_name"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Two counts need the branch and an age band. The key stays only if a join needs it; nothing else serves the purpose.","misconceptions":["","Keeps the exact birth date, which the age band already serves","Dropping only the direct identifiers keeps an exact date and the join date the question does not use","A copy of the table without the name is a second table to secure, and still holds the phone"],"lo":["LO5"],"day":4,"session":2,"slide":{"deck":"day4","id":"check-view","title":"Which view gives the analysts what they need, and no more?"},"level":null,"pool":"checkpoint"},{"id":"check-index-q1","type":"single","prompt":"A clinic's appointments table, 2 million rows, an index on patient_id.","options":[{"key":"A","text":"appointments per month this year"},{"key":"B","text":"appointments of doctor D12"},{"key":"C","text":"patients whose number ends in 42"},{"key":"D","text":"appointments of patient P-1093"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"An exact value of the indexed column: the engine goes to that patient's entries and reads only those rows.","misconceptions":["A count by month reads every row; the index has nothing to skip","The condition is on the doctor, not the indexed column","A pattern with a leading % cannot use the order of the index",""],"lo":["LO3"],"day":4,"session":3,"slide":{"deck":"day4","id":"check-index","title":"Which query can an index on patient_id turn into a search?"},"level":null,"pool":"checkpoint"},{"id":"check-test-q1","type":"single","prompt":"A pharmacy fixture has six orders, none with two delivery attempts. The generated revenue query matches the hand-checked answer.","options":[{"key":"A","text":"The query is correct on the full data"},{"key":"B","text":"It follows the rule on the cases the fixture holds; repeat attempts are untested"},{"key":"C","text":"Nothing: generated queries cannot be trusted"},{"key":"D","text":"The fixture is too small to mean anything"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A test proves the cases in the fixture. Fan-out over repeat attempts needs a fixture with repeat attempts.","misconceptions":["A fixture proves only the cases it contains","","A passing test is evidence; discarding it wastes the check","The size of a fixture does not decide; its cases do"],"lo":["LO6"],"day":4,"session":4,"slide":{"deck":"day4","id":"check-test","title":"A generated query passes its test. What does that show?"},"level":null,"pool":"checkpoint"},{"id":"d1-staff-key","type":"single","prompt":"A training team keeps a table of course bookings: 640 rows, 410 distinct employee codes, 52 distinct course codes and 640 distinct pairs of employee and course session. Which of these is a key of the table?","options":[{"key":"A","text":"The pair of employee and course session"},{"key":"B","text":"There is no key, since no single column is unique"},{"key":"C","text":"The employee code"},{"key":"D","text":"The course code"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Six hundred and forty distinct pairs for 640 rows: no pair repeats, so the pair names exactly one booking.","misconceptions":["","Believes a key must be one column; a pair can be the key","Takes an identifier-looking column as a key although 410 distinct values for 640 rows means it repeats","Confuses a column that groups rows with one that names a row"],"lo":["LO1"],"day":1,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"d1-grain-sentence","type":"single","prompt":"A fleet team's table has one row each time a vehicle is refuelled, with the vehicle code, the date and the litres. Which sentence states its grain?","options":[{"key":"A","text":"One row per day"},{"key":"B","text":"One row per litre of fuel"},{"key":"C","text":"One row per vehicle"},{"key":"D","text":"One row per refuelling of one vehicle"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Each row records one refuelling event of one vehicle; the vehicle and the date are facts about that event.","misconceptions":["Takes the date column for the grain: several vehicles refuel on one day","Mistakes a measure in the row for what the row stands for","Reads the grain from the first column: a vehicle refuelled ten times has ten rows",""],"lo":["LO1"],"day":1,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"d1-fewest-zero","type":"single","prompt":"A facilities team counts work orders per building by grouping the work-order table by building and taking the smallest count. It reads 1. Fourteen buildings have no work order at all. What does the query report as the fewest work orders per building?","options":[{"key":"A","text":"NULL, because some buildings have no rows"},{"key":"B","text":"0, because the fourteen buildings are counted"},{"key":"C","text":"1, because buildings without work orders are not in the grouped table"},{"key":"D","text":"14, the number of buildings that have no work order in the table at all"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"Grouping the work orders only produces groups for buildings that have at least one; counting from the buildings table with a left join would show the zeros.","misconceptions":["Expects a NULL for a group that simply does not exist in the result","Assumes grouping the many side sees rows that do not appear in it","","Confuses the count of empty groups with the size of the smallest group"],"lo":["LO1"],"day":1,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"d1-wide-copy","type":"tf","prompt":"In an analytical wide table that repeats each branch's city on every sales row, the right way to correct a branch's city is to update the wide table's rows for that branch.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The wide table is a copy built from the source; the city is corrected once in the branch table and the wide table is rebuilt.","misconceptions":["Treats the copy as the home of the fact: a partial update leaves two cities for one branch",""],"lo":["LO1"],"day":1,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"d1-half-open","type":"single","prompt":"A help desk stores ticket creation as a TIMESTAMP. A report must count every ticket created in April 2026. Which condition is right?","options":[{"key":"A","text":"created_at BETWEEN '2026-04-01' AND '2026-04-30'"},{"key":"B","text":"created_at >= '2026-04-01' AND created_at \u003c '2026-05-01'"},{"key":"C","text":"created_at > '2026-04-01' AND created_at \u003c '2026-04-30'"},{"key":"D","text":"MONTH(created_at) = 4, which reads the month of every timestamp directly"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The half-open range from 1 April up to but not including 1 May keeps every instant of April and nothing else.","misconceptions":["Forgets that the end date means the first instant of 30 April on a timestamp","","Drops the first instant of April and all of 30 April","Ignores the year: April of another year would be counted too"],"lo":["LO3"],"day":1,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"d2-case-order","type":"single","prompt":"A payroll query bands overtime hours: CASE WHEN hours \u003c= 10 THEN 'low' WHEN hours \u003c= 2 THEN 'minimal' ELSE 'high' END. A worker with 1 hour of overtime gets which band?","options":[{"key":"A","text":"low"},{"key":"B","text":"high"},{"key":"C","text":"NULL"},{"key":"D","text":"minimal"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"CASE takes the first branch whose condition is true; 1 \u003c= 10 is true, so the second branch is never reached.","misconceptions":["","Reads ELSE as the branch for values the other branches describe badly","Expects a value matched by two branches to be ambiguous and left empty","Believes CASE picks the most specific branch rather than the first true one"],"lo":["LO3"],"day":2,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"d2-null-not-equal","type":"single","prompt":"A staff table has 10 rows: 6 in department HR, 2 in IT and 2 with no department recorded. How many rows does WHERE department \u003c> 'HR' keep?","options":[{"key":"A","text":"0"},{"key":"B","text":"10"},{"key":"C","text":"4"},{"key":"D","text":"2"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Only the two IT rows make the condition true; for the two missing departments it is unknown.","misconceptions":["Believes a NULL anywhere in the column empties the whole result","Ignores the filter for rows that have no value","Treats a missing department as different from HR; the comparison is unknown and the row is dropped",""],"lo":["LO2"],"day":2,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"d2-count-column","type":"tf","prompt":"In any table, COUNT(*) and COUNT(phone) return the same number.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"COUNT(phone) skips rows where phone is NULL; COUNT(*) counts every row.","misconceptions":["Thinks COUNT of a column counts rows, whatever their values",""],"lo":["LO2"],"day":2,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"d2-having","type":"single","prompt":"A clinic wants the doctors who saw more than 200 patients last month. Where does the condition COUNT(*) > 200 belong?","options":[{"key":"A","text":"In the SELECT list"},{"key":"B","text":"In WHERE, before GROUP BY, so fewer rows are grouped"},{"key":"C","text":"In HAVING, after GROUP BY doctor"},{"key":"D","text":"In ORDER BY"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"The count of each doctor exists only once rows are grouped; HAVING filters those groups.","misconceptions":["Thinks computing the count also filters on it","Believes WHERE can test a count, which only exists after grouping","","Confuses sorting the groups with filtering them"],"lo":["LO3"],"day":2,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"d2-group-rows","type":"single","prompt":"A table of 300 library loans covers 4 branches. SELECT branch, COUNT(*) FROM loans WHERE returned = false GROUP BY branch returns rows for how many branches at most?","options":[{"key":"A","text":"300"},{"key":"B","text":"4"},{"key":"C","text":"1"},{"key":"D","text":"It cannot be known without running it"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"One row per branch that still has a row after WHERE: at most 4.","misconceptions":["Counts input rows: a GROUP BY returns one row per group","","Thinks the filter collapses the groups into one","Overlooks that the number of groups cannot exceed the number of distinct branches"],"lo":["LO2"],"day":2,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"d2-left-join-count","type":"single","prompt":"teams has 3 rows; members has 5 rows: team A has 3 members, team B has 2, team C none. How many rows does teams INNER JOIN members return?","options":[{"key":"A","text":"5"},{"key":"B","text":"15"},{"key":"C","text":"3"},{"key":"D","text":"6"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Five matched pairs; team C has no member, so the inner join drops it.","misconceptions":["","Multiplies the tables as a cross join would","Counts the left table, as if a join could not repeat its rows","Adds a row for team C, as a left join would"],"lo":["LO2"],"day":2,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"d2-anti","type":"single","prompt":"A school wants the courses that no student has enrolled in. Which pattern answers it?","options":[{"key":"A","text":"courses WHERE EXISTS (an enrolment for that course)"},{"key":"B","text":"enrolments GROUP BY course HAVING COUNT(*) = 0, which counts the empty courses"},{"key":"C","text":"courses INNER JOIN enrolments"},{"key":"D","text":"courses WHERE NOT EXISTS (an enrolment for that course)"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"An anti join keeps the rows of courses for which no enrolment exists.","misconceptions":["A semi join keeps courses with at least one enrolment","Groups that have no rows never appear, so the count is never 0","Keeps only courses that do have enrolments: the opposite of the question",""],"lo":["LO3"],"day":2,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"d3-fanout-cause","type":"single","prompt":"A gym sums membership fees after joining members (one row per member) to visits (one row per visit). The total is several times the fee ledger. What happened?","options":[{"key":"A","text":"The join changed the fee values"},{"key":"B","text":"Members without visits were counted twice"},{"key":"C","text":"Each member's fee was repeated once per visit"},{"key":"D","text":"NULL fees were counted as zero"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"After the join the grain is the visit, so each fee appears as many times as its member visited.","misconceptions":["A join copies values; it never changes them","An inner join drops members without visits; it does not add them","","Zeros cannot raise a total"],"lo":["LO6"],"day":3,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"d3-fanout-fix","type":"single","prompt":"You need total fees of members who visited at least once, each fee counted once. Which query shape is right?","options":[{"key":"A","text":"Join members to visits and SUM(DISTINCT fee)"},{"key":"B","text":"SUM(fee) over members WHERE EXISTS a visit for that member"},{"key":"C","text":"SUM(fee) over members LEFT JOIN visits, so members without visits stay in"},{"key":"D","text":"Join members to visits and SUM(fee)"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Using visits only as a filter keeps the grain at one row per member.","misconceptions":["Merges different members who pay the same fee","","Still repeats each fee per visit, and keeps members who never visited","Sums one fee per visit"],"lo":["LO3"],"day":3,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"d3-cte-check","type":"single","prompt":"A chain of three common table expressions returns a total that looks too high. What is the best first move?","options":[{"key":"A","text":"Run each step alone and check its row count and grain"},{"key":"B","text":"Round every amount to whole riyals"},{"key":"C","text":"Add DISTINCT to the final SELECT"},{"key":"D","text":"Rewrite it as one query without WITH"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Each named step can be run alone; the step whose grain is wrong is where the total grows.","misconceptions":["","Rounding cannot explain a large excess","Hides a symptom without finding the step that repeats rows","Changes the form, not the logic"],"lo":["LO3"],"day":3,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"d3-rule-outside","type":"tf","prompt":"If a query runs without an error on the schema, it follows the business rules of the organisation.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Rules such as which statuses count as revenue are often kept outside the schema; a query can ignore them and still run.","misconceptions":["Believes the schema encodes every business rule",""],"lo":["LO6"],"day":3,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"d3-window-rows","type":"single","prompt":"A table has 120 rows for 4 warehouses. How many rows does SELECT warehouse, SUM(stock) OVER (PARTITION BY warehouse) FROM stock return?","options":[{"key":"A","text":"1"},{"key":"B","text":"480"},{"key":"C","text":"4"},{"key":"D","text":"120"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"A window keeps every input row and adds a value computed over its partition.","misconceptions":["Thinks the window collapses the table to a single total","Thinks each row is repeated once per partition","Confuses a window with GROUP BY, which would collapse each warehouse to one row",""],"lo":["LO4"],"day":3,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"d3-rank-ties","type":"single","prompt":"Scores 90, 85, 85 and 80 are ranked from the highest with DENSE_RANK(). Which places do they get?","options":[{"key":"A","text":"1, 2, 3, 4"},{"key":"B","text":"1, 2, 2, 4"},{"key":"C","text":"1, 2, 2, 3"},{"key":"D","text":"1, 1, 2, 3"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"DENSE_RANK gives ties the same place and does not skip the next place.","misconceptions":["That is ROW_NUMBER, which never repeats a number","That is RANK, which skips after a tie","","Ties only the first two values, which are not equal"],"lo":["LO4"],"day":3,"session":3,"slide":null,"level":"apply","pool":"practice"},{"id":"d3-frame","type":"single","prompt":"A daily table of a clinic has no rows for the days it was closed. Which frame averages the last seven calendar days for each day?","options":[{"key":"A","text":"ROWS BETWEEN 6 PRECEDING AND CURRENT ROW"},{"key":"B","text":"RANGE BETWEEN INTERVAL 6 DAYS PRECEDING AND CURRENT ROW"},{"key":"C","text":"ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW"},{"key":"D","text":"PARTITION BY week"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A RANGE frame on the date includes exactly the rows dated within the last seven days.","misconceptions":["Counts rows: after closed days it reaches back further than seven days","","A running average since the first day, not a moving one","A partition by week is not a moving window of seven days"],"lo":["LO4"],"day":3,"session":4,"slide":null,"level":"apply","pool":"practice"},{"id":"d3-lag-first","type":"tf","prompt":"LAG(amount) OVER (PARTITION BY customer ORDER BY day) returns NULL on the first row of every customer.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Each partition starts afresh, and its first row has no previous row to read.","misconceptions":["","Thinks LAG reads the last row of the previous customer"],"lo":["LO4"],"day":3,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"d4-constraint-kind","type":"single","prompt":"A library's loans table must refuse a loan whose member code is not in the members table. Which constraint does that?","options":[{"key":"A","text":"A foreign key REFERENCES members (member_code)"},{"key":"B","text":"A CHECK on the member code that compares it with the members table"},{"key":"C","text":"A PRIMARY KEY on the member code"},{"key":"D","text":"NOT NULL on the member code"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"A foreign key refuses any value with no matching row on the referenced side.","misconceptions":["","A CHECK tests a condition on the row itself; it cannot look up another table","Would allow each member only one loan, and still not test that the member exists","Refuses only an empty code, not a code that names nobody"],"lo":["LO5"],"day":4,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"d4-stage-text","type":"single","prompt":"Why does a load of a raw supplier file go first into a staging table with every column as text?","options":[{"key":"A","text":"Because text columns make the final table smaller"},{"key":"B","text":"Because constraints cannot be written on text columns"},{"key":"C","text":"So that the bad rows are fixed automatically"},{"key":"D","text":"So that every row is read and each bad row gets a reason"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Loaded straight into a constrained table, the insert stops at the first bad row. Staged as text, all rows are in and can be sorted into good and rejected.","misconceptions":["Confuses the staging table with the final one, which keeps its proper types","Text columns can carry constraints; staging simply has none","Staging finds bad rows; it does not correct them",""],"lo":["LO5"],"day":4,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"d4-transaction","type":"single","prompt":"A team loads 300 invoices and then their 1,100 invoice lines inside one transaction. The lines insert fails on a constraint and the transaction is rolled back. How many invoices remain loaded?","options":[{"key":"A","text":"It depends on the order of the rows in the file"},{"key":"B","text":"300"},{"key":"C","text":"0"},{"key":"D","text":"300 minus the invoices of the failing lines"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A rollback undoes every change of the transaction, the successful statements included.","misconceptions":["A rollback undoes the whole transaction regardless of order","Assumes the first statement was kept because it succeeded","","Thinks a rollback removes only the rows related to the error"],"lo":["LO5"],"day":4,"session":1,"slide":null,"level":"apply","pool":"practice"},{"id":"d4-log-balance","type":"tf","prompt":"A load log that reads \"read 1,000, loaded 960, rejected 40\" accounts for every row of the file.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Every row read was either loaded or rejected: 960 + 40 = 1,000.","misconceptions":["","Thinks rejected rows are lost rather than accounted for"],"lo":["LO5"],"day":4,"session":1,"slide":null,"level":"understand","pool":"practice"},{"id":"d4-indirect","type":"single","prompt":"A sports club's members table has member_number, full_name, mobile, postcode, birth_date and newsletter (yes or no). Which column is an indirect identifier?","options":[{"key":"A","text":"mobile"},{"key":"B","text":"postcode"},{"key":"C","text":"newsletter"},{"key":"D","text":"full_name"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"A postcode alone does not name anyone, but combined with a birth date it can single a member out.","misconceptions":["A mobile number reaches the person by itself: a direct identifier","","A yes or no choice identifies no one, even with other columns","A name points to the person by itself: a direct identifier"],"lo":["LO5"],"day":4,"session":2,"slide":null,"level":"understand","pool":"practice"},{"id":"d4-view-minimum","type":"single","prompt":"Analysts of a utility company count meters per district and per installation year. The meters table has meter_id, customer_name, customer_phone, district, installed_on and address. What should their view expose?","options":[{"key":"A","text":"meter_id, district and the installation year"},{"key":"B","text":"meter_id, district, installed_on and address"},{"key":"C","text":"A copy of the table with the names replaced by initials"},{"key":"D","text":"Every column except customer_name"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"Two counts need the district and the year; the key stays only if a join needs it. The minimum necessary for the purpose is the whole view.","misconceptions":["","Keeps an exact date and the address where a year and the district serve the purpose","A copy is a second table to secure, and initials with an address still identify","Keeps the phone and the address, which the counts do not use"],"lo":["LO5"],"day":4,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"d4-genai","type":"single","prompt":"An analyst wants help from a public generative AI assistant with a query over a Restricted customer table. What may be pasted into it?","options":[{"key":"A","text":"Twenty sample rows, to show the shape of the data"},{"key":"B","text":"A screenshot of the result with the names blurred"},{"key":"C","text":"The output of the analyst view, since it has no names, phones or e-mail addresses"},{"key":"D","text":"The column names, the business rule as text and the error message"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"Only Public data goes into a generative AI tool: the schema and the rule, never the rows.","misconceptions":["Rows of a Restricted table stay out, however few","A result of Restricted data is still Restricted data","A view limits columns; its rows keep the level of the table behind it",""],"lo":["LO5"],"day":4,"session":2,"slide":null,"level":"apply","pool":"practice"},{"id":"d4-index-total","type":"tf","prompt":"An index on the store column turns a query that sums every sale of the year by store into a search.","options":[{"key":"A","text":"True"},{"key":"B","text":"False"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"The query reads every row of the year anyway; an index helps a query that picks few rows by an exact value or a range.","misconceptions":["Expects any query on an indexed column to search",""],"lo":["LO3"],"day":4,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"d4-plan-bottom","type":"single","prompt":"In the plan of a query that joins two tables, filters one of them and groups the result, which operators appear at the bottom of the tree?","options":[{"key":"A","text":"The projection of the returned columns"},{"key":"B","text":"The join"},{"key":"C","text":"The scans that read the two tables"},{"key":"D","text":"The group by"}],"correct":[2],"answer":null,"tolerance":null,"unit":null,"explanation":"A plan is read from the bottom up: the scans read the tables and pass their rows to the operators above.","misconceptions":["The projection is the last step, at the top","The join needs rows from both scans, so it sits above them","","The group needs the joined rows, so it sits above the join"],"lo":["LO3"],"day":4,"session":3,"slide":null,"level":"understand","pool":"practice"},{"id":"d4-fanout-class","type":"single","prompt":"A generated query sums the value of shipped parcels after joining parcels to tracking_events, one row per scan of a parcel. On a hand-checked fixture it returns 410.00 where the answer is 205.00. Which kind of failure is it most likely?","options":[{"key":"A","text":"A missing business rule"},{"key":"B","text":"Fan-out from the join to the events"},{"key":"C","text":"Wrong grain in the average"},{"key":"D","text":"A rounding error"}],"correct":[1],"answer":null,"tolerance":null,"unit":null,"explanation":"Each parcel is repeated once per scan event, so every value is summed once per scan: two scans each, twice the total.","misconceptions":["A missing rule gives a small, explainable difference; doubling points to repeated rows","","There is no average here, and a grain error does not double a sum","Rounding cannot double a total"],"lo":["LO6"],"day":4,"session":4,"slide":null,"level":"analyze","pool":"practice"},{"id":"d4-expected-source","type":"single","prompt":"Where should the expected answer of a test for a generated query come from?","options":[{"key":"A","text":"By hand, on a fixture small enough to check"},{"key":"B","text":"From the total in last month's report"},{"key":"C","text":"From running the generated query on the full data"},{"key":"D","text":"From a second generated query"}],"correct":[0],"answer":null,"tolerance":null,"unit":null,"explanation":"The expected answer must be independent of SQL: worked out by hand from the rule on tables small enough to print.","misconceptions":["","Last month's report may have been made by a query with the same error","Compares the query with itself","Another generated query can share the same mistake"],"lo":["LO6"],"day":4,"session":4,"slide":null,"level":"understand","pool":"practice"},{"id":"d4-grain-avg","type":"single","prompt":"The question is \"average value per order\". A generated query returns AVG(quantity * unit_price) over order lines. Orders have about four lines each. What is wrong?","options":[{"key":"A","text":"Nothing: AVG gives the average of the values"},{"key":"B","text":"It misses the discount rule, so every line is a little too high"},{"key":"C","text":"It double counts lines through a join"},{"key":"D","text":"It averages per line, not per order: sum the lines of each order first"}],"correct":[3],"answer":null,"tolerance":null,"unit":null,"explanation":"The average is taken at the grain of the line. The question's grain is the order: total each order, then average the totals.","misconceptions":["Ignores the grain: the values are per line","Could also be true, but does not explain a result about four times too small","There is no join to repeat rows",""],"lo":["LO6"],"day":4,"session":4,"slide":null,"level":"analyze","pool":"practice"}]}</script>
